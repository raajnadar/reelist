name: Deploy web to GitHub Pages

# Every action is pinned to a commit SHA, with its tag in the trailing comment.
# A tag can be moved; a SHA cannot, so a compromised action cannot reach this
# workflow through a re-pointed tag. The RootNative repositories pin the same
# way. Bump with the tag comment and the SHA together, never one alone.

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without a new commit.
  workflow_dispatch:

# GITHUB_TOKEN needs these to publish a Pages artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. `cancel-in-progress: false` differs from the CI
# workflow on purpose: cancelling a running deploy can leave the site
# half-published, so a queued deploy waits instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the web bundle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages

      # Pages serves a project site from a subpath, so the bundled asset URLs
      # must carry that prefix. `base_path` comes from configure-pages and is
      # '/reelist' here. app.config.js reads EXPO_BASE_URL and passes it to
      # `experiments.baseUrl`. Without this the page loads and every asset 404s.
      # The proxy URL, not the TMDB key. Anything behind EXPO_PUBLIC_ is inlined
      # into the bundle and can be read out of the published site, so the key
      # must never appear here. The proxy holds it. See proxy/README.md.
      # The films the export writes a static page for: the three home lists,
      # fetched through the proxy. See lib/prerender.ts. The step takes about
      # two minutes, because it stays under the proxy's rate limit.
      - name: Fetch the prerender seed
        env:
          EXPO_PUBLIC_TMDB_PROXY_URL: ${{ vars.EXPO_PUBLIC_TMDB_PROXY_URL }}
        run: yarn prerender:seed

      - name: Build the static site
        env:
          EXPO_BASE_URL: ${{ steps.pages.outputs.base_path }}
          EXPO_PUBLIC_TMDB_PROXY_URL: ${{ vars.EXPO_PUBLIC_TMDB_PROXY_URL }}
        run: yarn export:web

      # Lists the home page, the genre pages, and the seeded films, which are
      # the pages the export wrote a file for. `base_url` is the site address
      # Pages reports, so the sitemap needs no copy of it. public/robots.txt
      # points a crawler at this file.
      - name: Write the sitemap
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: yarn sitemap

      # The export writes one HTML file per route and per prerendered film, and
      # Pages serves `movie/123.html` for `/movie/123` with a 200. Every other
      # film is a deep link with no file. Pages has no rewrite rule, so it
      # answers with 404.html, and copying the home page there makes that
      # answer the app: the client router reads the address and draws the film.
      # A search engine still sees the 404 status for those films, which is why
      # the seed above exists.
      - name: Add the 404 fallback for client routing
        run: cp dist/index.html dist/404.html

      # .nojekyll stops Pages ignoring the _expo directory. Jekyll skips paths
      # that start with an underscore, which is where the whole JS bundle lives.
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
