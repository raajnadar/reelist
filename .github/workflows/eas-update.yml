name: Publish EAS Update

# Every action is pinned to a commit SHA, with its tag in the trailing comment.
# A tag can be moved; a SHA cannot, so a compromised action cannot reach this
# workflow through a re-pointed tag. The RootNative repositories pin the same
# way. Bump with the tag comment and the SHA together, never one alone.

on:
  push:
    branches: [main]
  workflow_dispatch:

# The token only needs to read the repository. EAS authenticates with its own
# EXPO_TOKEN secret, not with GITHUB_TOKEN.
permissions:
  contents: read

# The QR code in the README points at the `main` channel. This job republishes
# that channel, so the code keeps working without the image ever changing.
concurrency:
  group: eas-update
  cancel-in-progress: false

jobs:
  update:
    name: Publish to the main channel
    runs-on: ubuntu-latest

    # Skips the job on a fork and on any repository that has no token, instead
    # of failing the run with a confusing authentication error.
    if: ${{ github.repository == 'raajnadar/reelist' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # --branch main matches the channel the README QR code points at.
      # --non-interactive fails instead of prompting when something is missing.
      # The proxy URL is inlined into the bundle this step builds. It is public
      # by design, so it is a variable and not a secret. The TMDB key must never
      # appear here: the bundle this publishes can be read out of Expo Go.
      - name: Publish the update
        env:
          EXPO_PUBLIC_TMDB_PROXY_URL: ${{ vars.EXPO_PUBLIC_TMDB_PROXY_URL }}
        run: eas update --branch main --message "${{ github.event.head_commit.message || 'Manual update' }}" --non-interactive
