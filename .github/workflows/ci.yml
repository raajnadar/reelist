name: CI

# Every action is pinned to a commit SHA, with its tag in the trailing comment.
# A tag can be moved; a SHA cannot, so a compromised action cannot reach this
# workflow through a re-pointed tag. The RootNative repositories pin the same
# way. Bump with the tag comment and the SHA together, never one alone.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The token only needs to read the repository.
permissions:
  contents: read

# A new push to the same branch cancels the run that is already going. The last
# commit is the only one whose result matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, and format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The version comes from .nvmrc, so CI and the development machine cannot
      # drift apart. Node 24 is the current Active LTS. Keep .nvmrc and the
      # `engines` field in package.json equal; no workflow repeats the number.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      # --frozen-lockfile makes the job fail if package.json and yarn.lock
      # disagree. Without it, CI silently resolves a different dependency tree
      # than the one a developer gets.
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # `proxy/` is a separate project with its own package.json and yarn.lock,
      # because Vercel deploys it on its own. The root checks still read it: tsc
      # includes proxy/**/*.ts, eslint lints the whole tree, and jest runs the
      # `proxy` project. Those checks need @upstash/* on disk, so install here
      # too. Without this step every check fails on an unresolved import.
      - name: Install proxy dependencies
        run: yarn --cwd proxy install --frozen-lockfile

      # Each check runs even after an earlier one fails. One push then reports
      # every problem, instead of one problem per push.
      #
      # `typecheck` generates the route types first. `.expo/` is gitignored, so
      # this checkout has none, and without them a link to a route that does not
      # exist passes. See scripts/generate-route-types.js.
      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: yarn lint

      - name: Check formatting
        if: ${{ !cancelled() }}
        run: yarn format:check

      # Jest transforms the whole React Native module graph on a cold cache,
      # which costs more than every test in the suite together. The cache is a
      # pure function of the dependencies and the Babel and Jest configuration,
      # so the key holds those three files. A cache hit makes the run about
      # three times faster. `restore-keys` still gives a partial hit after a
      # dependency bump, because Jest re-transforms only what changed.
      - name: Restore the Jest cache
        if: ${{ !cancelled() }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .jest-cache
          key: jest-${{ runner.os }}-${{ hashFiles('yarn.lock', 'proxy/yarn.lock', 'babel.config.js', 'jest.config.js') }}
          restore-keys: jest-${{ runner.os }}-

      # The only check that runs the code instead of reading it. `--ci` fails on
      # a missing snapshot rather than writing one, so a snapshot never lands in
      # the repository from a CI run.
      - name: Test
        if: ${{ !cancelled() }}
        run: yarn test --ci
