name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the run that is already going. The last
# commit is the only one whose result matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, and format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Node 24 is the current Active LTS, and the version the developers run.
      # CI and the development machine then share one major version, so a
      # failure here reproduces locally. Keep this number, .nvmrc, and the
      # `engines` field in package.json equal.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      # --frozen-lockfile makes the job fail if package.json and yarn.lock
      # disagree. Without it, CI silently resolves a different dependency tree
      # than the one a developer gets.
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # `proxy/` is a separate project with its own package.json and yarn.lock,
      # because Vercel deploys it on its own. The root checks still read it: tsc
      # includes proxy/**/*.ts, eslint lints the whole tree, and jest runs the
      # `proxy` project. Those checks need @upstash/* on disk, so install here
      # too. Without this step every check fails on an unresolved import.
      - name: Install proxy dependencies
        run: yarn --cwd proxy install --frozen-lockfile

      # Each check runs even after an earlier one fails. One push then reports
      # every problem, instead of one problem per push.
      #
      # `typecheck` generates the route types first. `.expo/` is gitignored, so
      # this checkout has none, and without them a link to a route that does not
      # exist passes. See scripts/generate-route-types.js.
      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: yarn lint

      - name: Check formatting
        if: ${{ !cancelled() }}
        run: yarn format:check

      # The only check that runs the code instead of reading it. `--ci` fails on
      # a missing snapshot rather than writing one, so a snapshot never lands in
      # the repository from a CI run.
      - name: Test
        if: ${{ !cancelled() }}
        run: yarn test --ci
